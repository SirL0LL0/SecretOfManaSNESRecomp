format_version = 1
id = "som.language"
version = "1.0.0"
name = "Language"
author = "Mumble Translation (v2.0), packaged for this recompilation"
description = "Plays the game in Italian: the player supplies the translation patch, it is applied to the ROM in memory, and the ROM file on disk is never modified."
resolver = "declarative"

# The original English (US) release the patch applies to.
[[target]]
game_id = "secret-of-mana"
rom_sha256 = "4c15013131351e694e05f22e38bb1b3e4031dedac77ec75abecebe8520d82d5f"

# The translated ROM itself: the player may already own it, and then the
# patch has nothing to do.
[[target]]
game_id = "secret-of-mana"
rom_sha256 = "8622ebc30446c5a620a110f2fc2622aac82c6fa75f946b666b221592d57cc275"

[[feature]]
id = "italian"
name = "Italiano"
group = "Language"
description = "Applies the Mumble Translation patch to the English ROM, in memory, before the game starts. Choose the patch file on this row (it comes from the official archive at mumble.romhacking.it/som.html and is not distributed here). The result is checked against the image this executable was generated from, so a wrong patch refuses to run. Takes effect on the next launch."
default_enabled = false

# The translation patch is not distributed: the player brings it.
[[resource]]
feature = "italian"
id = "patch"
label = "Translation patch (IPS)"
description = "The Mumble Translation patch for Secret of Mana (USA), from the official archive (mumble.romhacking.it/som.html), applied to the original English ROM."
format = "file"
required = true
