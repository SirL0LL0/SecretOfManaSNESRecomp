[[feature]]
id = "fixes"
name = "Italian translation fixes"
group = "Translation"
description = "Applied in memory at launch; the ROM file is never modified. Bridge at the waterfall (prologue): Timothy's line \"Dev'essere una specie di tesoro!\" began outside the text box, then appeared in a borderless box shifted to the right. Takes effect on the next launch."
