format_version = 1
id = "som.restore-unused-fanfares"
version = "1.2.0"
name = "Restore Unused Fanfares"
author = "Kethinov"
description = "Plays the two unused fanfares: one when receiving the Sea Hare's Tail, one when receiving the Moogle Belt."
