rom_sha256 = "4c15013131351e694e05f22e38bb1b3e4031dedac77ec75abecebe8520d82d5f"


[[feature]]
id = "restore"
name = "Restore Unused Fanfares"
group = "Music"
description = "Kethinov's Restore Unused Fanfares 1.2, for the English and the Italian game. Applied in memory at launch; the ROM file is never modified. Takes effect on the next launch."
default_enabled = false

# Same three records as the original patch. src/som_main.c applies them in
# memory before SnesInit, at the US offsets (09B923/09CA6E/0A0E44) or, with the
# Italian translation, where it keeps them (09A6CA/09B6DF/0A0DE2).
