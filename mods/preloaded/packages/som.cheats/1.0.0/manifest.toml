format_version = 1
id = "som.cheats"
version = "1.0.0"
name = "Cheats"
author = "Almar's Guides (Pro Action Replay), RPGClassics (RAM map, Galoob Game Genie list)"
description = "Cheat codes that work on the recompiled game: RAM codes, rewritten every frame, and codes that change game data (prices, stats, event scripts)."
resolver = "declarative"

# The Italian translation (Mumble Translation v2.0) this executable verifies.
[[target]]
game_id = "secret-of-mana"
rom_sha256 = "8622ebc30446c5a620a110f2fc2622aac82c6fa75f946b666b221592d57cc275"

# The original US release the language pack starts from: the same game, before
# the translation, which the pack turns into the image above in memory.
[[target]]
game_id = "secret-of-mana"
rom_sha256 = "4c15013131351e694e05f22e38bb1b3e4031dedac77ec75abecebe8520d82d5f"


[[feature]]
id = "cheats"
name = "Cheats"
group = "Cheats"
description = "Turn the feature on, then the cheats you want. Codes that patch the game's instructions are not offered: recompiled code would ignore them. Takes effect on the next launch."
default_enabled = false

# Provided by the executable (src/som_cheats.c): the per-frame RAM writes.
[[plugin]]
feature = "cheats"
id = "som.cheats"

[[option]]
feature = "cheats"
id = "unlimited_hp"
label = "Unlimited HP (Hero, Girl, Sprite)"
description = "Keeps current HP at max HP (7EE182/E184, 7EE382/E384, 7EE582/E584)."
group = "Characters"
type = "boolean"
default = false

[[option]]
feature = "cheats"
